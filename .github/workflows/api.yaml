name: API

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'api/**'
      - '.github/workflows/api.yaml'

  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'api/**'
      - '.github/workflows/api.yaml'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run workflow on'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

# Superseded runs on the same branch or PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}
          persist-credentials: false

      # pnpm has to be on PATH before setup-node, or its pnpm cache resolution
      # has no package manager to query.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: api/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Unit test
        run: pnpm test
